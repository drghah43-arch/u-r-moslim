<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>أذكار النوم</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="background">
    <div class="stars"></div>
    <div class="glow"></div>
</div>

<header class="topbar">

    <a href="azkar.html" class="back">
        ← الأذكار
    </a>

    <div class="top-title">
        🌌 أذكار النوم
    </div>

</header>

<main class="zekr-page">

    <div class="zekr-header">

        <span>لَيْلٌ هَادِئ</span>

        <h1>
            أذكار النوم
        </h1>

    </div>

    <div class="progress-area">

        <div class="progress-info">

            <span id="progressText">
                الذكر 1
            </span>

            <span id="overallProgress">
                0%
            </span>

        </div>

        <div class="progress-track">

            <div id="progressBar"></div>

        </div>

    </div>


    <section
        id="zekrCard"
        class="interactive-zekr"
    >

        <div class="tap-circle">

            <span id="counter">
                0 / 1
            </span>

        </div>

        <div
            id="zekrText"
            class="zekr-text"
        ></div>

        <div class="tap-hint">
            اضغط على الشاشة للتكرار
        </div>

    </section>


    <button
        id="resetButton"
        class="reset-button"
    >
        إعادة الأذكار
    </button>

</main>

<script src="script.js"></script>

<script>

const sleepAzkar = [

{
text:
"باسمك اللهم أموت وأحيا.",
count: 1
},

{
text:
"سبحان الله.",
count: 33
},

{
text:
"الحمد لله.",
count: 33
},

{
text:
"الله أكبر.",
count: 34
}

];

startAzkar(
    sleepAzkar,
    "sleep"
);

</script>

</body>
</html>
