<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>أذكار الصباح</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="background">
    <div class="stars"></div>
    <div class="glow"></div>
</div>

<header class="topbar">

    <a href="azkar.html" class="back">
        ← الأذكار
    </a>

    <div class="top-title">
        ☀️ أذكار الصباح
    </div>

</header>

<main class="zekr-page">

    <div class="zekr-header">

        <span>صَبَاحٌ مُبَارَك</span>

        <h1>
            أذكار الصباح
        </h1>

    </div>

    <div class="progress-area">

        <div class="progress-info">

            <span id="progressText">
                الذكر 1
            </span>

            <span id="overallProgress">
                0%
            </span>

        </div>

        <div class="progress-track">

            <div id="progressBar"></div>

        </div>

    </div>


    <section
        id="zekrCard"
        class="interactive-zekr"
    >

        <div class="tap-circle">

            <span id="counter">
                0 / 1
            </span>

        </div>

        <div
            id="zekrText"
            class="zekr-text"
        ></div>

        <div class="tap-hint">
            اضغط على الشاشة للتكرار
        </div>

    </section>


    <button
        id="resetButton"
        class="reset-button"
    >
        إعادة الأذكار
    </button>

</main>

<script src="script.js"></script>

<script>

const morningAzkar = [

{
text:
"أصبحنا وأصبح الملك لله، والحمد لله، لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير.",
count: 1
},

{
text:
"اللهم بك أصبحنا وبك أمسينا، وبك نحيا وبك نموت وإليك النشور.",
count: 1
},

{
text:
"رضيت بالله ربًا، وبالإسلام دينًا، وبمحمد ﷺ نبيًا.",
count: 3
},

{
text:
"اللهم إني أسألك العفو والعافية في الدنيا والآخرة.",
count: 3
},

{
text:
"اللهم عافني في بدني، اللهم عافني في سمعي، اللهم عافني في بصري، لا إله إلا أنت.",
count: 3
},

{
text:
"حسبي الله لا إله إلا هو، عليه توكلت وهو رب العرش العظيم.",
count: 7
},

{
text:
"سبحان الله وبحمده.",
count: 100
}

];

startAzkar(
    morningAzkar,
    "morning"
);

</script>

</body>
</html>
